<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RSS 다이제스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;

    /* brand & accent */
    --primary: #0075de;
    --primary-active: #005bab;
    --on-primary: #ffffff;
    --secondary: #213183; /* deep indigo hero */

    /* decorative sticker palette (category dots only) */
    --accent-sky: #62aef0;
    --accent-purple: #d6b6f6;
    --accent-purple-deep: #391c57;
    --accent-pink: #ff64c8;
    --accent-orange: #dd5b00;
    --accent-orange-deep: #793400;
    --accent-teal: #2a9d99;
    --accent-green: #1aae39;
    --accent-brown: #523410;

    /* surface */
    --canvas: #ffffff;
    --surface: #ffffff;
    --canvas-soft: #f6f5f4;
    --hairline: #e6e6e6;

    /* text */
    --ink: #000000;
    --ink-secondary: #31302e;
    --ink-muted: #615d59;
    --ink-faint: #a39e98;

    /* radius */
    --r-xs: 4px;
    --r-sm: 5px;
    --r-md: 8px;
    --r-lg: 12px;
    --r-xl: 16px;
    --r-full: 9999px;

    /* elevation */
    --shadow-1:
      rgba(0,0,0,0.01) 0 0.175px 1.041px,
      rgba(0,0,0,0.02) 0 0.8px 2.925px,
      rgba(0,0,0,0.027) 0 2.025px 7.847px,
      rgba(0,0,0,0.04) 0 4px 18px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--canvas-soft);
    color: var(--ink);
    font-family: "Inter", -apple-system, system-ui, "Segoe UI", "Malgun Gothic", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---- hero-band ---- */
  .hero-band {
    background: var(--secondary);
    color: #ffffff;
    padding: 56px 24px 64px;
    position: relative;
    overflow: hidden;
  }
  .hero-band::before,
  .hero-band::after {
    content: "";
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: var(--r-full);
    background: rgba(255,255,255,0.55);
    box-shadow:
      60px 24px 0 0 rgba(255,255,255,0.35),
      140px -8px 0 0 rgba(255,255,255,0.25),
      220px 40px 0 0 rgba(255,255,255,0.4),
      -40px 50px 0 0 rgba(255,255,255,0.2),
      300px 10px 0 0 rgba(255,255,255,0.3);
  }
  .hero-band::before { top: 20px; left: 8%; }
  .hero-band::after { top: 70px; right: 10%; }
  .hero-inner {
    max-width: 980px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .eyebrow-inverse {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.125px;
    color: rgba(255,255,255,0.75);
    text-transform: uppercase;
    margin: 0 0 14px;
  }
  .hero-title {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.1;
    margin: 0 0 10px;
    color: #ffffff;
  }
  .hero-subtitle {
    font-size: 16px;
    line-height: 1.5;
    color: rgba(255,255,255,0.72);
    margin: 0 0 28px;
    max-width: 560px;
  }
  .hero-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* ---- buttons ---- */
  .button-secondary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #ffffff;
    color: var(--ink);
    font-size: 16px;
    font-weight: 500;
    border: none;
    border-radius: var(--r-full);
    padding: 10px 20px;
    cursor: pointer;
    box-shadow: var(--shadow-1);
  }
  .button-secondary:hover { text-decoration: none; }
  .button-secondary:active { transform: scale(0.96); }

  .button-utility {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    color: var(--ink);
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--hairline);
    border-radius: var(--r-md);
    padding: 6px 14px;
    cursor: pointer;
  }
  .button-utility:hover { text-decoration: none; border-color: #c9c9c9; }

  /* ---- layout ---- */
  main {
    max-width: 980px;
    margin: -28px auto 0;
    padding: 0 24px 72px;
    position: relative;
    z-index: 2;
  }
  section { margin-top: 40px; }
  section:first-of-type { margin-top: 0; }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .section-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.625px;
    margin: 0;
  }

  /* ---- badge-pill ---- */
  .badge-pill {
    display: inline-flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--hairline);
    color: var(--primary);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.125px;
    border-radius: var(--r-full);
    padding: 5px 12px;
    white-space: nowrap;
  }

  /* ---- feature-card ---- */
  .feature-card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--r-lg);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .category-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px;
  }
  .category-dot {
    width: 9px;
    height: 9px;
    border-radius: var(--r-full);
    flex: none;
  }
  .category-name {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.125px;
    color: var(--ink);
  }
  .category-count {
    font-size: 14px;
    color: var(--ink-faint);
    font-weight: 400;
  }
  .headline-list { list-style: none; margin: 0; padding: 0; }
  .headline-row {
    display: flex;
    gap: 10px;
    padding: 9px 0;
    border-top: 1px solid var(--hairline);
    font-size: 15px;
    line-height: 1.4;
  }
  .headline-row:first-child { border-top: none; }
  .headline-row .dot-sep { color: var(--ink-faint); flex: none; }
  .headline-row a { color: var(--ink); font-weight: 500; }
  .headline-row a:hover { color: var(--primary); }
  .headline-outlet { color: var(--ink-faint); font-size: 13px; white-space: nowrap; flex: none; }

  /* ---- history ---- */
  details.history-entry {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--r-lg);
    margin-bottom: 10px;
    padding: 16px 20px;
  }
  details.history-entry summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    font-size: 15px;
    font-weight: 600;
  }
  details.history-entry summary::-webkit-details-marker { display: none; }
  details.history-entry summary .meta {
    color: var(--ink-faint);
    font-weight: 400;
    font-size: 13px;
  }
  details.history-entry .feature-card {
    margin-top: 14px;
    box-shadow: none;
  }
  details.history-entry[open] summary { margin-bottom: 4px; }

  /* ---- data table ---- */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  thead th {
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.125px;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--hairline);
  }
  tbody td {
    padding: 10px 10px;
    border-bottom: 1px solid var(--hairline);
    color: var(--ink-secondary);
  }
  tbody tr:last-child td { border-bottom: none; }
  td.feed-name a { color: var(--ink-secondary); }
  td.feed-name a:hover { color: var(--primary); }
  .status-cell { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: var(--r-full); flex: none; }
  .dot-ok { background: var(--accent-green); }
  .dot-fail { background: var(--accent-orange); }
  .dot-disabled { background: var(--ink-faint); }

  .empty {
    color: var(--ink-faint);
    font-size: 15px;
    padding: 18px 0;
  }

  /* ---- footer ---- */
  footer {
    max-width: 980px;
    margin: 0 auto;
    padding: 24px 24px 48px;
    border-top: 1px solid var(--hairline);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  footer, footer a {
    color: var(--ink-secondary);
    font-size: 14px;
  }
  #status-line { color: var(--ink-faint); font-size: 13px; }

  @media (max-width: 640px) {
    .hero-title { font-size: 32px; letter-spacing: -0.5px; }
    main { margin-top: -20px; }
    .section-title { font-size: 22px; }
    .headline-row { flex-direction: column; gap: 2px; }
  }
</style>
</head>
<body>

<div class="hero-band">
  <div class="hero-inner">
    <p class="eyebrow-inverse">RSS → Discord</p>
    <h1 class="hero-title">일일 증시 다이제스트</h1>
    <p class="hero-subtitle">2시간마다 국내·미국 증시 RSS를 수집하고, 하루 한 번 카테고리별 헤드라인으로 정리해 Discord로 보냅니다. AI 요약 없이 원문 제목과 출처만 그대로 전달합니다.</p>
    <div class="hero-actions">
      <button class="button-secondary" id="refresh-btn">
        <span>새로고침</span>
      </button>
      <a class="button-secondary" href="https://github.com/awesome72/RSS" target="_blank" rel="noopener">GitHub 저장소</a>
    </div>
  </div>
</div>

<main>
  <section>
    <div class="section-head">
      <h2 class="section-title">최신 다이제스트</h2>
      <span class="badge-pill" id="latest-badge">불러오는 중…</span>
    </div>
    <div id="latest"></div>
  </section>

  <section>
    <div class="section-head">
      <h2 class="section-title">이전 다이제스트</h2>
    </div>
    <div id="history"></div>
  </section>

  <section>
    <div class="section-head">
      <h2 class="section-title">피드 상태</h2>
    </div>
    <div class="feature-card" style="padding:8px 22px;">
      <div class="table-wrap" id="feeds"></div>
    </div>
  </section>
</main>

<footer>
  <span id="status-line">불러오는 중…</span>
  <a href="https://github.com/awesome72/RSS" target="_blank" rel="noopener">awesome72/RSS</a>
</footer>

<script>
const REPO_RAW = "https://raw.githubusercontent.com/awesome72/RSS/main/state/";

const CATEGORY_DOT = {
  "국내 증시": "var(--accent-teal)",
  "미국 증시": "var(--accent-sky)",
  "매크로·공시": "var(--accent-purple-deep)",
  "Google News 우회 (로이터·블룸버그·MarketWatch용)": "var(--accent-orange)",
};
const DEFAULT_DOT = "var(--accent-brown)";

function categoryDot(name) {
  return CATEGORY_DOT[name] || DEFAULT_DOT;
}

function categoryLabel(name) {
  if (name && name.startsWith("Google News 우회")) return "Google News 우회";
  return name || "기타";
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function renderGroups(groups) {
  const entries = Object.entries(groups || {});
  if (!entries.length) return renderEmpty("헤드라인 없음");

  return entries.map(([category, articles]) => `
    <div class="feature-card">
      <div class="category-head">
        <span class="category-dot" style="background:${categoryDot(category)}"></span>
        <span class="category-name">${escapeHtml(categoryLabel(category))}</span>
        <span class="category-count">${articles.length}건</span>
      </div>
      <ul class="headline-list">
        ${articles.map((a) => `
          <li class="headline-row">
            <span class="dot-sep">·</span>
            <a href="${escapeHtml(a.link)}" target="_blank" rel="noopener">${escapeHtml(a.title)}</a>
            <span class="headline-outlet">${escapeHtml(a.outlet || "")}</span>
          </li>
        `).join("")}
      </ul>
    </div>
  `).join("");
}

function renderEmpty(msg) {
  return `<div class="empty">${escapeHtml(msg)}</div>`;
}

function countHeadlines(groups) {
  return Object.values(groups || {}).reduce((sum, a) => sum + a.length, 0);
}

async function fetchJson(name) {
  const res = await fetch(REPO_RAW + name + "?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error(`${name} 로드 실패 (${res.status})`);
  return res.json();
}

function formatDateTime(iso) {
  if (!iso) return "";
  try {
    return new Date(iso).toLocaleString("ko-KR", { hour12: false });
  } catch {
    return iso;
  }
}

async function load() {
  const statusEl = document.getElementById("status-line");
  const latestBadge = document.getElementById("latest-badge");
  statusEl.textContent = "불러오는 중…";

  try {
    const [history, health] = await Promise.all([
      fetchJson("digest_history.json"),
      fetchJson("feeds_health.json"),
    ]);

    const latestEl = document.getElementById("latest");
    const historyEl = document.getElementById("history");
    const feedsEl = document.getElementById("feeds");

    if (!history.length) {
      latestBadge.textContent = "발송 이력 없음";
      latestEl.innerHTML = renderEmpty("아직 발송된 다이제스트가 없습니다. 첫 실행을 기다려 주세요.");
      historyEl.innerHTML = renderEmpty("이력 없음");
    } else {
      const sorted = [...history].sort((a, b) => (b.sent_at || "").localeCompare(a.sent_at || ""));
      const latest = sorted[0];
      const older = sorted.slice(1);
      const headlineCount = countHeadlines(latest.groups);

      latestBadge.textContent = `${latest.date} · ${latest.collected}건 수집 · 헤드라인 ${headlineCount}건`;
      latestEl.innerHTML = renderGroups(latest.groups);

      historyEl.innerHTML = older.length
        ? older.map((entry) => `
          <details class="history-entry">
            <summary>
              <span>${escapeHtml(entry.date)} · 헤드라인 ${countHeadlines(entry.groups)}건</span>
              <span class="meta">${escapeHtml(formatDateTime(entry.sent_at))}</span>
            </summary>
            ${renderGroups(entry.groups)}
          </details>
        `).join("")
        : renderEmpty("이전 이력 없음");
    }

    const feedRows = Object.entries(health || {})
      .sort((a, b) => (b[1].fail || 0) - (a[1].fail || 0))
      .map(([url, h]) => {
        const dotClass = h.disabled ? "dot-disabled" : (h.fail > 0 ? "dot-fail" : "dot-ok");
        const label = h.disabled ? "비활성화" : (h.fail > 0 ? "실패 있음" : "정상");
        return `
          <tr>
            <td class="feed-name"><a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a></td>
            <td>${h.success || 0}</td>
            <td>${h.fail || 0}</td>
            <td><span class="status-cell"><span class="dot ${dotClass}"></span>${label}</span></td>
          </tr>`;
      })
      .join("");

    feedsEl.innerHTML = feedRows
      ? `<table>
          <thead><tr><th>피드</th><th>성공</th><th>실패</th><th>상태</th></tr></thead>
          <tbody>${feedRows}</tbody>
        </table>`
      : renderEmpty("피드 상태 정보 없음");

    statusEl.textContent = "마지막 갱신: " + new Date().toLocaleTimeString("ko-KR", { hour12: false });
  } catch (err) {
    statusEl.textContent = "불러오기 실패: " + err.message;
  }
}

document.getElementById("refresh-btn").addEventListener("click", load);
load();
</script>
</body>
</html>
