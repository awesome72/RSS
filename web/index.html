<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RSS 다이제스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light dark;

    /* brand & accent */
    --primary: #0075de;
    --primary-active: #005bab;
    --primary-tint: #eaf3fd;
    --on-primary: #ffffff;
    --secondary: #213183; /* deep indigo hero — stays dark in both themes by design */

    /* decorative sticker palette (category dots only) */
    --accent-sky: #62aef0;
    --accent-purple: #d6b6f6;
    --accent-purple-deep: #391c57;
    --accent-pink: #ff64c8;
    --accent-orange: #dd5b00;
    --accent-orange-deep: #793400;
    --accent-teal: #2a9d99;
    --accent-green: #1aae39;
    --accent-brown: #523410;

    /* surface */
    --canvas: #ffffff;
    --surface: #ffffff;
    --canvas-soft: #f6f5f4;
    --hairline: #e6e6e6;

    /* text — ink-muted/ink-secondary used for anything a user actually reads;
       ink-faint reserved for pure decoration (bullets, disabled dots) */
    --ink: #000000;
    --ink-secondary: #31302e;
    --ink-muted: #615d59;
    --ink-faint: #a39e98;

    /* radius */
    --r-xs: 4px;
    --r-sm: 5px;
    --r-md: 8px;
    --r-lg: 12px;
    --r-xl: 16px;
    --r-full: 9999px;

    /* elevation */
    --shadow-1:
      rgba(0,0,0,0.01) 0 0.175px 1.041px,
      rgba(0,0,0,0.02) 0 0.8px 2.925px,
      rgba(0,0,0,0.027) 0 2.025px 7.847px,
      rgba(0,0,0,0.04) 0 4px 18px;
  }

  /* dark palette — applied automatically via system preference, or forced
     via [data-theme="dark"] from the manual toggle below */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #4ea1f5;
      --primary-active: #7dbcf8;
      --primary-tint: #16283a;
      --surface: #1f2024;
      --canvas-soft: #17181a;
      --hairline: #2c2d31;
      --ink: #f2f1ef;
      --ink-secondary: #cfcdc9;
      --ink-muted: #9c988f;
      --ink-faint: #6f6a64;
      --shadow-1: rgba(0,0,0,0.35) 0 4px 18px;
    }
  }
  :root[data-theme="dark"] {
    --primary: #4ea1f5;
    --primary-active: #7dbcf8;
    --primary-tint: #16283a;
    --surface: #1f2024;
    --canvas-soft: #17181a;
    --hairline: #2c2d31;
    --ink: #f2f1ef;
    --ink-secondary: #cfcdc9;
    --ink-muted: #9c988f;
    --ink-faint: #6f6a64;
    --shadow-1: rgba(0,0,0,0.35) 0 4px 18px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--canvas-soft);
    color: var(--ink);
    font-family: "Inter", -apple-system, system-ui, "Segoe UI", "Malgun Gothic", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* ---- hero-band ---- */
  .hero-band {
    background: var(--secondary);
    color: #ffffff;
    padding: 56px 24px 64px;
    position: relative;
    overflow: hidden;
  }
  .hero-band::before,
  .hero-band::after {
    content: "";
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: var(--r-full);
    background: rgba(255,255,255,0.55);
    box-shadow:
      60px 24px 0 0 rgba(255,255,255,0.35),
      140px -8px 0 0 rgba(255,255,255,0.25),
      220px 40px 0 0 rgba(255,255,255,0.4),
      -40px 50px 0 0 rgba(255,255,255,0.2),
      300px 10px 0 0 rgba(255,255,255,0.3);
  }
  .hero-band::before { top: 20px; left: 8%; }
  .hero-band::after { top: 70px; right: 10%; }
  .hero-inner {
    max-width: 980px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .eyebrow-inverse {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.125px;
    color: rgba(255,255,255,0.8);
    text-transform: uppercase;
    margin: 0 0 14px;
  }
  .hero-title {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.1;
    margin: 0 0 10px;
    color: #ffffff;
  }
  .hero-subtitle {
    font-size: 16px;
    line-height: 1.5;
    color: rgba(255,255,255,0.82);
    margin: 0 0 28px;
    max-width: 580px;
  }
  .hero-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* ---- buttons ---- */
  .button-secondary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #ffffff;
    color: var(--ink);
    font-size: 16px;
    font-weight: 500;
    border: none;
    border-radius: var(--r-full);
    padding: 10px 20px;
    cursor: pointer;
    box-shadow: var(--shadow-1);
  }
  .button-secondary:hover { text-decoration: none; }
  .button-secondary:active { transform: scale(0.96); }

  .button-utility {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    color: var(--ink-secondary);
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--hairline);
    border-radius: var(--r-md);
    padding: 6px 14px;
    cursor: pointer;
  }
  .button-utility:hover { text-decoration: none; border-color: #c9c9c9; color: var(--ink); }

  .button-utility-inverse {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.35);
    color: rgba(255,255,255,0.85);
    border-radius: var(--r-full);
    padding: 9px 18px;
    font-size: 14px;
  }
  .button-utility-inverse:hover { border-color: rgba(255,255,255,0.65); color: #ffffff; }

  /* ---- layout ---- */
  main {
    max-width: 980px;
    margin: -28px auto 0;
    padding: 0 24px 72px;
    position: relative;
    z-index: 2;
  }
  section { margin-top: 40px; }
  section:first-of-type { margin-top: 0; }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .section-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.625px;
    margin: 0;
  }
  .section-title-row { display: flex; align-items: center; gap: 10px; }

  /* ---- badge-pill ---- */
  .badge-pill {
    display: inline-flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--hairline);
    color: var(--primary);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.125px;
    border-radius: var(--r-full);
    padding: 5px 12px;
    white-space: nowrap;
  }

  /* ---- controls: search + category chips ---- */
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--r-lg);
    padding: 14px 16px;
    margin-bottom: 28px;
    box-shadow: var(--shadow-1);
  }
  .search-box {
    flex: 1 1 220px;
    min-width: 180px;
  }
  .search-box input {
    width: 100%;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--canvas-soft);
    border: 1px solid var(--hairline);
    border-radius: var(--r-full);
    padding: 9px 16px;
  }
  .search-box input::placeholder { color: var(--ink-faint); }
  .search-box input:focus { border-color: var(--primary); background: var(--surface); }
  .category-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-secondary);
    background: var(--canvas-soft);
    border: 1px solid var(--hairline);
    border-radius: var(--r-full);
    padding: 6px 13px;
    cursor: pointer;
  }
  .chip:hover { border-color: #c9c9c9; }
  .chip .chip-dot { width: 7px; height: 7px; border-radius: var(--r-full); flex: none; }
  .chip.active {
    background: var(--primary-tint);
    border-color: var(--primary);
    color: var(--primary);
    font-weight: 600;
  }

  /* ---- feature-card ---- */
  .feature-card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--r-lg);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .category-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px;
  }
  .category-dot {
    width: 9px;
    height: 9px;
    border-radius: var(--r-full);
    flex: none;
  }
  .category-name {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.125px;
    color: var(--ink);
  }
  .category-count {
    font-size: 14px;
    color: var(--ink-muted);
    font-weight: 400;
  }
  .headline-list { list-style: none; margin: 0; padding: 0; }
  .headline-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 10px 8px;
    margin: 0 -8px;
    border-top: 1px solid var(--hairline);
    font-size: 15px;
    line-height: 1.5;
    border-radius: var(--r-sm);
  }
  .headline-row:first-child { border-top: none; }
  .headline-row:hover { background: var(--canvas-soft); }
  .headline-row .dot-sep { color: var(--ink-faint); flex: none; }
  .headline-row a { color: var(--ink); font-weight: 500; }
  .headline-row a:hover { color: var(--primary); }
  .headline-outlet { color: var(--ink-muted); font-size: 13px; white-space: nowrap; flex: none; margin-left: auto; padding-left: 10px; }

  /* ---- history ---- */
  details.history-entry {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--r-lg);
    margin-bottom: 10px;
    padding: 16px 20px;
  }
  details.history-entry summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    font-size: 15px;
    font-weight: 600;
  }
  details.history-entry summary::-webkit-details-marker { display: none; }
  details.history-entry summary .meta {
    color: var(--ink-muted);
    font-weight: 400;
    font-size: 13px;
  }
  details.history-entry .feature-card {
    margin-top: 14px;
    box-shadow: none;
  }
  details.history-entry[open] summary { margin-bottom: 4px; }

  /* ---- data table ---- */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  thead th {
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.125px;
    text-transform: uppercase;
    color: var(--ink-muted);
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--hairline);
  }
  tbody td {
    padding: 10px 10px;
    border-bottom: 1px solid var(--hairline);
    color: var(--ink-secondary);
  }
  tbody tr:hover td { background: var(--canvas-soft); }
  tbody tr:last-child td { border-bottom: none; }
  td.feed-name a { color: var(--ink-secondary); }
  td.feed-name a:hover { color: var(--primary); }
  .status-cell { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-weight: 500; }
  .dot { width: 7px; height: 7px; border-radius: var(--r-full); flex: none; }
  .dot-ok { background: var(--accent-green); }
  .dot-fail { background: var(--accent-orange); }
  .dot-disabled { background: var(--ink-faint); }

  .empty {
    color: var(--ink-muted);
    font-size: 15px;
    padding: 18px 0;
  }

  /* ---- footer ---- */
  footer {
    max-width: 980px;
    margin: 0 auto;
    padding: 24px 24px 48px;
    border-top: 1px solid var(--hairline);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  footer, footer a {
    color: var(--ink-secondary);
    font-size: 14px;
  }
  #status-line { color: var(--ink-muted); font-size: 13px; }

  @media (max-width: 640px) {
    .hero-title { font-size: 32px; letter-spacing: -0.5px; }
    main { margin-top: -20px; }
    .section-title { font-size: 22px; }
    .headline-row { flex-wrap: wrap; }
    .headline-outlet { margin-left: 0; padding-left: 0; }
  }
</style>
</head>
<body>

<div class="hero-band">
  <div class="hero-inner">
    <p class="eyebrow-inverse">RSS → Discord</p>
    <h1 class="hero-title">일일 증시 다이제스트</h1>
    <p class="hero-subtitle">2시간마다 국내·미국 증시, 국채금리, 반도체, 지정학 리스크 RSS를 수집하고, 하루 한 번 카테고리별 헤드라인으로 정리해 Discord로 보냅니다. AI 요약 없이 원문 제목과 출처만 그대로 전달합니다.</p>
    <div class="hero-actions">
      <button class="button-secondary" id="refresh-btn">
        <span>새로고침</span>
      </button>
      <a class="button-secondary" href="https://github.com/awesome72/RSS" target="_blank" rel="noopener">GitHub 저장소</a>
      <button class="button-utility button-utility-inverse" id="theme-toggle-btn">다크 모드</button>
    </div>
  </div>
</div>

<main>
  <div class="controls">
    <div class="search-box">
      <input id="search-input" type="text" placeholder="헤드라인 · 출처 검색…" autocomplete="off" />
    </div>
    <div class="category-chips" id="category-chips"></div>
  </div>

  <section>
    <div class="section-head">
      <h2 class="section-title">최신 다이제스트</h2>
      <span class="badge-pill" id="latest-badge">불러오는 중…</span>
    </div>
    <div id="latest"></div>
  </section>

  <section>
    <div class="section-head">
      <div class="section-title-row">
        <h2 class="section-title">이전 다이제스트</h2>
      </div>
      <button class="button-utility" id="toggle-history-btn">모두 펼치기</button>
    </div>
    <div id="history"></div>
  </section>

  <section>
    <div class="section-head">
      <h2 class="section-title">피드 상태</h2>
    </div>
    <div class="feature-card" style="padding:8px 22px;">
      <div class="table-wrap" id="feeds"></div>
    </div>
  </section>
</main>

<footer>
  <span id="status-line">불러오는 중…</span>
  <a href="https://github.com/awesome72/RSS" target="_blank" rel="noopener">awesome72/RSS</a>
</footer>

<script>
const REPO_RAW = "https://raw.githubusercontent.com/awesome72/RSS/main/state/";

const THEME_KEY = "rss-dashboard-theme";

function systemPrefersDark() {
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}

function applyTheme(theme) {
  // theme: "light" | "dark" | null (= follow system)
  if (theme) {
    document.documentElement.dataset.theme = theme;
  } else {
    delete document.documentElement.dataset.theme;
  }
  const isDark = theme ? theme === "dark" : systemPrefersDark();
  const btn = document.getElementById("theme-toggle-btn");
  if (btn) btn.textContent = isDark ? "라이트 모드" : "다크 모드";
}

function initTheme() {
  let saved = null;
  try {
    saved = localStorage.getItem(THEME_KEY);
  } catch {
    /* localStorage unavailable (private mode, blocked storage) — fall back to system */
  }
  applyTheme(saved);
}

function toggleTheme() {
  const current = document.documentElement.dataset.theme || (systemPrefersDark() ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  applyTheme(next);
  try {
    localStorage.setItem(THEME_KEY, next);
  } catch {
    /* per-viewer convenience only — safe to skip persistence if storage is blocked */
  }
}

const CATEGORY_DOT = {
  "국내 증시": "var(--accent-teal)",
  "미국 증시": "var(--accent-sky)",
  "매크로·공시": "var(--accent-purple-deep)",
  "반도체·기술": "var(--accent-green)",
  "전쟁·지정학": "var(--accent-brown)",
};
const DEFAULT_DOT = "var(--ink-faint)";

let categoryFilter = null; // null = 전체

function categoryDot(name) {
  return CATEGORY_DOT[name] || DEFAULT_DOT;
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function renderGroups(groups) {
  const entries = Object.entries(groups || {});
  if (!entries.length) return renderEmpty("헤드라인 없음");

  return entries.map(([category, articles]) => `
    <div class="feature-card" data-category="${escapeHtml(category)}">
      <div class="category-head">
        <span class="category-dot" style="background:${categoryDot(category)}"></span>
        <span class="category-name">${escapeHtml(category)}</span>
        <span class="category-count">${articles.length}건</span>
      </div>
      <ul class="headline-list">
        ${articles.map((a) => `
          <li class="headline-row" data-search="${escapeHtml((a.title + " " + (a.outlet || "")).toLowerCase())}">
            <span class="dot-sep">·</span>
            <a href="${escapeHtml(a.link)}" target="_blank" rel="noopener">${escapeHtml(a.title)}</a>
            <span class="headline-outlet">${escapeHtml(a.outlet || "")}</span>
          </li>
        `).join("")}
      </ul>
    </div>
  `).join("");
}

function renderEmpty(msg) {
  return `<div class="empty">${escapeHtml(msg)}</div>`;
}

function countHeadlines(groups) {
  return Object.values(groups || {}).reduce((sum, a) => sum + a.length, 0);
}

function collectCategories(history) {
  const set = new Set();
  history.forEach((entry) => Object.keys(entry.groups || {}).forEach((c) => set.add(c)));
  return [...set];
}

function renderChips(categories) {
  const chipsEl = document.getElementById("category-chips");
  const allChip = `<button class="chip ${categoryFilter === null ? "active" : ""}" data-chip="__all__">전체</button>`;
  const catChips = categories.map((c) => `
    <button class="chip ${categoryFilter === c ? "active" : ""}" data-chip="${escapeHtml(c)}">
      <span class="chip-dot" style="background:${categoryDot(c)}"></span>${escapeHtml(c)}
    </button>
  `).join("");
  chipsEl.innerHTML = allChip + catChips;

  chipsEl.querySelectorAll(".chip").forEach((btn) => {
    btn.addEventListener("click", () => {
      const val = btn.dataset.chip;
      categoryFilter = val === "__all__" ? null : val;
      renderChips(categories);
      applyFilters();
    });
  });
}

function applyFilters() {
  const query = document.getElementById("search-input").value.trim().toLowerCase();

  document.querySelectorAll(".feature-card[data-category]").forEach((card) => {
    const cat = card.dataset.category;
    const catMatch = !categoryFilter || cat === categoryFilter;
    let visibleRows = 0;

    card.querySelectorAll(".headline-row").forEach((row) => {
      const show = catMatch && (!query || row.dataset.search.includes(query));
      row.hidden = !show;
      if (show) visibleRows++;
    });

    card.hidden = visibleRows === 0;
    if (query && visibleRows > 0) {
      const details = card.closest("details.history-entry");
      if (details) details.open = true;
    }
  });

  document.querySelectorAll("details.history-entry").forEach((details) => {
    const anyVisible = [...details.querySelectorAll(".feature-card[data-category]")].some((c) => !c.hidden);
    details.hidden = !anyVisible;
  });

  ["latest", "history"].forEach((id) => {
    const container = document.getElementById(id);
    const hasVisible = container.querySelector(".feature-card[data-category]:not([hidden])")
      || container.querySelector("details.history-entry:not([hidden])");
    let notice = container.querySelector(".filter-empty");
    if (!hasVisible && container.querySelector(".feature-card[data-category], details.history-entry")) {
      if (!notice) {
        notice = document.createElement("div");
        notice.className = "empty filter-empty";
        notice.textContent = "조건에 맞는 결과가 없습니다.";
        container.appendChild(notice);
      }
    } else if (notice) {
      notice.remove();
    }
  });
}

async function fetchJson(name) {
  const res = await fetch(REPO_RAW + name + "?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error(`${name} 로드 실패 (${res.status})`);
  return res.json();
}

function formatDateTime(iso) {
  if (!iso) return "";
  try {
    return new Date(iso).toLocaleString("ko-KR", { hour12: false });
  } catch {
    return iso;
  }
}

async function load() {
  const statusEl = document.getElementById("status-line");
  const latestBadge = document.getElementById("latest-badge");
  statusEl.textContent = "불러오는 중…";

  try {
    const [history, health] = await Promise.all([
      fetchJson("digest_history.json"),
      fetchJson("feeds_health.json"),
    ]);

    const latestEl = document.getElementById("latest");
    const historyEl = document.getElementById("history");
    const feedsEl = document.getElementById("feeds");

    if (!history.length) {
      latestBadge.textContent = "발송 이력 없음";
      latestEl.innerHTML = renderEmpty("아직 발송된 다이제스트가 없습니다. 첫 실행을 기다려 주세요.");
      historyEl.innerHTML = renderEmpty("이력 없음");
      renderChips([]);
    } else {
      const sorted = [...history].sort((a, b) => (b.sent_at || "").localeCompare(a.sent_at || ""));
      const latest = sorted[0];
      const older = sorted.slice(1);
      const headlineCount = countHeadlines(latest.groups);

      latestBadge.textContent = `${latest.date} · ${latest.collected}건 수집 · 헤드라인 ${headlineCount}건`;
      latestEl.innerHTML = renderGroups(latest.groups);

      historyEl.innerHTML = older.length
        ? older.map((entry) => `
          <details class="history-entry">
            <summary>
              <span>${escapeHtml(entry.date)} · 헤드라인 ${countHeadlines(entry.groups)}건</span>
              <span class="meta">${escapeHtml(formatDateTime(entry.sent_at))}</span>
            </summary>
            ${renderGroups(entry.groups)}
          </details>
        `).join("")
        : renderEmpty("이전 이력 없음");

      renderChips(collectCategories(sorted));
    }

    const feedRows = Object.entries(health || {})
      .sort((a, b) => (b[1].fail || 0) - (a[1].fail || 0))
      .map(([url, h]) => {
        const dotClass = h.disabled ? "dot-disabled" : (h.fail > 0 ? "dot-fail" : "dot-ok");
        const label = h.disabled ? "비활성화" : (h.fail > 0 ? "실패 있음" : "정상");
        return `
          <tr>
            <td class="feed-name"><a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a></td>
            <td>${h.success || 0}</td>
            <td>${h.fail || 0}</td>
            <td><span class="status-cell"><span class="dot ${dotClass}"></span>${label}</span></td>
          </tr>`;
      })
      .join("");

    feedsEl.innerHTML = feedRows
      ? `<table>
          <thead><tr><th>피드</th><th>성공</th><th>실패</th><th>상태</th></tr></thead>
          <tbody>${feedRows}</tbody>
        </table>`
      : renderEmpty("피드 상태 정보 없음");

    applyFilters();
    statusEl.textContent = "마지막 갱신: " + new Date().toLocaleTimeString("ko-KR", { hour12: false });
  } catch (err) {
    statusEl.textContent = "불러오기 실패: " + err.message;
  }
}

document.getElementById("refresh-btn").addEventListener("click", load);
document.getElementById("search-input").addEventListener("input", applyFilters);
document.getElementById("toggle-history-btn").addEventListener("click", (e) => {
  const entries = document.querySelectorAll("#history details.history-entry");
  const shouldOpen = e.target.textContent.includes("펼치기");
  entries.forEach((d) => { d.open = shouldOpen; });
  e.target.textContent = shouldOpen ? "모두 접기" : "모두 펼치기";
});
document.getElementById("theme-toggle-btn").addEventListener("click", toggleTheme);

initTheme();
load();
</script>
</body>
</html>
